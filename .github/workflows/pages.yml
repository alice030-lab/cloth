name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter --suppress-analytics pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter --suppress-analytics analyze
          flutter --suppress-analytics test --reporter expanded
          python3 -m unittest discover -s tool -p 'test_*.py' -v
      - name: Choose public asset base
        id: site
        shell: bash
        run: |
          if [[ -s web/CNAME ]]; then
            echo 'base=/' >> "$GITHUB_OUTPUT"
          else
            echo "base=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static site
        run: flutter --suppress-analytics build web --release --no-web-resources-cdn --base-href='${{ steps.site.outputs.base }}'
      - name: Prepare Pages and offline cache
        run: |
          python3 tool/prepare_pages.py
          python3 tool/generate_offline_worker.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
