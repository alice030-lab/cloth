name: Native build validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native.yml'
      - 'lib/**'
      - 'native/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.*'
      - 'assets/**'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - run: flutter --suppress-analytics build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: outfit-canvas-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get --enforce-lockfile
      - run: flutter --suppress-analytics build ios --simulator --debug
      - uses: actions/upload-artifact@v4
        with:
          name: outfit-canvas-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 14
