name: outfit_canvas
description: 離線、可編輯的情境穿搭畫布。
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  file_saver: ^0.3.1
  share_plus: ^11.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  image: ^4.5.4
  path_drawing: ^1.0.1
  cupertino_icons: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/scenes/cafe.png
    - assets/fonts/LICENSE.txt
  fonts:
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC.otf
